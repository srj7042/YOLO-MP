<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO-MP • AI Attendance Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="glass-card auth-card">
        <div class="brand-badge">⚡ AI Face Recognition</div>
        <h1 class="auth-title">YOLO-MP Portal</h1>
        <p class="auth-subtitle">Sign in to access real-time biometric attendance</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="role">Select Portal Role</label>
                <select name="role" id="role" class="input-control">
                    <option value="admin">Administrator</option>
                    <option value="teacher">Faculty / Teacher</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="input-control" placeholder="••••••••" required>
                <small class="hint-text">Default: <code>admin123</code> / <code>teacher123</code></small>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign In &rarr;</button>
        </form>
    </div>
</div>

</body>
</html>
